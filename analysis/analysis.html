<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow Dashboard</title>
    <link rel="stylesheet" href="analysis.css">
    <script src="apexcharts.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <img src="../logo.jpg" class="logo">
                <h1>Focus Flow Dashboard</h1>
            </div>
            <div class="header-right">
                <div class="date-navigator">
                    <button id="themeToggle" class="icon-btn" title="Toggle Theme" style="margin-right: 8px;">
                        <svg id="moonIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg id="sunIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--yellow)"
                            stroke-width="2" style="display:none">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                    <button id="todayBtn" class="nav-btn" title="Back to Today" style="margin-right: 4px;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </button>
                    <button id="prevDay" class="nav-btn" title="Previous Day">&larr;</button>
                    <div class="date-display">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2" style="margin-right: 8px; opacity: 0.7;">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span id="currentDate"></span>
                        <input type="date" id="datePicker" class="date-input">
                    </div>
                    <button id="nextDay" class="nav-btn">&rarr;</button>
                </div>
            </div>
        </header>

        <main>
            <section class="stats-grid">
                <div class="card stat-card">
                    <h3>Total Focus Time</h3>
                    <p id="totalFocusTime" class="focus-color">0h 0m</p>
                    <div class="trend up">Focusing 12% more than yesterday</div>
                </div>
                <div class="card stat-card">
                    <h3>Top Distraction</h3>
                    <p id="topDistraction">None</p>
                    <span class="muted" id="distractionTime">0m</span>
                </div>
                <div class="card stat-card">
                    <h3>Study Efficiency</h3>
                    <p id="focusRatio" class="focus-color">0%</p>
                    <div class="progress-bar">
                        <div id="ratioProgress" class="progress" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <section class="charts">
                <div class="card chart-card">
                    <h3>Usage Distribution</h3>
                    <div class="chart-container">
                        <div id="usageChart"></div>
                    </div>
                </div>
                <div class="card top-sites">
                    <h3>Top Websites</h3>
                    <ul id="topSitesList">
                        <!-- Populated via JS -->
                    </ul>
                </div>
            </section>
            <section class="detailed-activity">
                <div class="card activity-card">
                    <h3>Detailed activity</h3>
                    <div class="table-container">
                        <table id="activityTable">
                            <thead>
                                <tr>
                                    <th>Page Title</th>
                                    <th>Domain</th>
                                    <th>Time Spent</th>
                                </tr>
                            </thead>
                            <tbody id="activityBody">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="analysis.js"></script>
</body>

</html>
