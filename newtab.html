<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab - Hocus Focus</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="newtab-container">
    <div class="newtab-header">
      <img src="logo.jpg" class="newtab-logo" alt="Hocus Focus">
      <span class="newtab-brand" style="font-size: 18px; font-weight: 700;"><span style="color: #14b8a6;">Hocus</span> <span style="color: #fbbf24;">Focus</span></span>
      <span class="newtab-greeting" id="greeting"></span>
    </div>

    <div class="newtab-score-card">
      <div class="newtab-score-circle" id="scoreCircle">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" class="score-bg"/>
          <circle cx="60" cy="60" r="52" class="score-fill" id="scoreFill"/>
        </svg>
        <span class="score-value" id="scoreValue">0</span>
        <span class="score-label">Focus Score</span>
      </div>
    </div>

    <div class="newtab-stats">
      <div class="newtab-stat">
        <span class="newtab-stat-value" id="focusTime">0m</span>
        <span class="newtab-stat-label">Deep Work</span>
      </div>
      <div class="newtab-stat-divider"></div>
      <div class="newtab-stat">
        <span class="newtab-stat-value" id="distractTime">0m</span>
        <span class="newtab-stat-label">Distracted</span>
      </div>
      <div class="newtab-stat-divider"></div>
      <div class="newtab-stat">
        <span class="newtab-stat-value" id="streakCount">0</span>
        <span class="newtab-stat-label">Day Streak</span>
      </div>
      <div class="newtab-stat-divider"></div>
      <div class="newtab-stat">
        <span class="newtab-stat-value" id="sitesCount">0</span>
        <span class="newtab-stat-label">Sites Visited</span>
      </div>
    </div>

    <div class="newtab-top-sites" id="topSites"></div>

    <div class="newtab-motivation" id="motivationQuote"></div>

    <a href="#" class="newtab-dashboard-link" id="dashboardLink">Open Full Dashboard</a>
  </div>

  <script type="module">
    import {
      getAllDomainStats, getAllUrlStats, getAllHourlyStats, getAllTempFocusLog,
      getDomainStatsByDate, getTempFocusLogByDate, getSessionsByDate,
      calculateWeightedScore, calculateSimpleScore
    } from './lib/stats-db.js';

    const IDB_KEYS = ['dailyStats', 'dailyUrlStats', 'hourlyStats', 'tempFocusLog'];
    const idbData = {
      dailyStats: await getAllDomainStats(),
      dailyUrlStats: await getAllUrlStats(),
      hourlyStats: await getAllHourlyStats(),
      tempFocusLog: await getAllTempFocusLog()
    };

    window._statsDB = {
      getDomainStatsByDate, getTempFocusLogByDate, getSessionsByDate,
      calculateWeightedScore, calculateSimpleScore,
      getAllDomainStats, getAllUrlStats, getAllHourlyStats, getAllTempFocusLog
    };

    const originalGet = chrome.storage.local.get.bind(chrome.storage.local);
    chrome.storage.local.get = function(keysOrDefaults, callback) {
      let requestedKeys = [];
      let defaults = {};
      if (Array.isArray(keysOrDefaults)) { requestedKeys = keysOrDefaults; }
      else if (typeof keysOrDefaults === 'object' && keysOrDefaults !== null) { requestedKeys = Object.keys(keysOrDefaults); defaults = keysOrDefaults; }
      else if (typeof keysOrDefaults === 'string') { requestedKeys = [keysOrDefaults]; }
      else { requestedKeys = IDB_KEYS; }

      const idbKeysNeeded = requestedKeys.filter(k => IDB_KEYS.includes(k));
      const chromeKeysNeeded = requestedKeys.filter(k => !IDB_KEYS.includes(k));
      if (idbKeysNeeded.length === 0) return originalGet(keysOrDefaults, callback);

      const chromeGet = chromeKeysNeeded.length > 0
        ? new Promise(resolve => {
            const cd = {}; chromeKeysNeeded.forEach(k => { if (k in defaults) cd[k] = defaults[k]; });
            originalGet(Object.keys(cd).length > 0 ? cd : chromeKeysNeeded, resolve);
          })
        : Promise.resolve({});

      chromeGet.then(chromeData => {
        const result = { ...chromeData };
        idbKeysNeeded.forEach(key => { if (idbData[key] !== undefined) result[key] = idbData[key]; });
        Object.entries(defaults).forEach(([k, v]) => { if (!(k in result) || result[k] === undefined) result[k] = v; });
        if (callback) callback(result);
      });
    };

    const script = document.createElement('script');
    script.src = 'newtab.js';
    document.body.appendChild(script);
  </script>
</body>
</html>
